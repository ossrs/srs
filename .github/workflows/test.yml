name: "Test"

# @see https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#onpushpull_requestbranchestags
on: [push, pull_request]

# Declare default permissions as read only.
permissions: read-all

# The dependency graph:
# test(10m) - utest-regression-blackbox-test
# multiple-arch-armv7(13m)
# multiple-arch-aarch64(7m)
# build-centos7(3m)
# fast(0s) - To limit all fastly run jobs after slow jobs.
#     integ(7m)
#     chrome
#     windows
#     build-ubuntu16(3m)
#     build-ubuntu18(2m)
#     build-ubuntu20(2m)
#     build-cross-arm(3m)
#     build-cross-aarch64(3m)
#     multiple-arch-amd64(2m)
#     coverage(3m)

jobs:

  fast:
    name: fast
    runs-on: ubuntu-22.04
    steps:
      - run: echo 'Start fast jobs'

  build-centos7:
    name: build-centos7
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # Build for CentOS 7
      - name: Build on CentOS7, baseline
        run: DOCKER_BUILDKIT=1 docker build -f trunk/Dockerfile.builds --target centos7-baseline .
      - name: Build on CentOS7, with all features
        run: DOCKER_BUILDKIT=1 docker build -f trunk/Dockerfile.builds --target centos7-all .
      - name: Build on CentOS7, without WebRTC
        run: DOCKER_BUILDKIT=1 docker build -f trunk/Dockerfile.builds --target centos7-no-webrtc .
      - name: Build on CentOS7, without ASM
        run: DOCKER_BUILDKIT=1 docker build -f trunk/Dockerfile.builds --target centos7-no-asm .
      - name: Build on CentOS7, C++98, no FFmpeg
        run: DOCKER_BUILDKIT=1 docker build -f trunk/Dockerfile.builds --target centos7-ansi-no-ffmpeg .
    runs-on: ubuntu-22.04

  build-ubuntu16:
    name: build-ubuntu16
    needs:
      - fast
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # Build for Ubuntu16
      - name: Build on Ubuntu16, baseline
        run: DOCKER_BUILDKIT=1 docker build -f trunk/Dockerfile.builds --target ubuntu16-baseline .
      - name: Build on Ubuntu16, with all features
        run: DOCKER_BUILDKIT=1 docker build -f trunk/Dockerfile.builds --target ubuntu16-all .
    runs-on: ubuntu-22.04

  build-ubuntu18:
    name: build-ubuntu18
    needs:
      - fast
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # Build for Ubuntu18
      - name: Build on Ubuntu18, baseline
        run: DOCKER_BUILDKIT=1 docker build -f trunk/Dockerfile.builds --target ubuntu18-baseline .
      - name: Build on Ubuntu18, with all features
        run: DOCKER_BUILDKIT=1 docker build -f trunk/Dockerfile.builds --target ubuntu18-all .
    runs-on: ubuntu-22.04

  build-ubuntu20:
    name: build-ubuntu20
    needs:
      - fast
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # Build for Ubuntu20
      - name: Build on Ubuntu20, default
        run: DOCKER_BUILDKIT=1 docker build -f trunk/Dockerfile.builds --target ubuntu20-default .
      - name: Build on Ubuntu20, baseline
        run: DOCKER_BUILDKIT=1 docker build -f trunk/Dockerfile.builds --target ubuntu20-baseline .
      - name: Build on Ubuntu20, with all features
        run: DOCKER_BUILDKIT=1 docker build -f trunk/Dockerfile.builds --target ubuntu20-all .
    runs-on: ubuntu-22.04

  build-cross-arm:
    name: build-cross-arm
    needs:
      - fast
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Cross Build for ARMv7 on Ubuntu16
        run: DOCKER_BUILDKIT=1 docker build -f trunk/Dockerfile.builds --target ubuntu16-cache-cross-armv7 .
      - name: Cross Build for ARMv7 on Ubuntu20
        run: DOCKER_BUILDKIT=1 docker build -f trunk/Dockerfile.builds --target ubuntu20-cache-cross-armv7 .
    runs-on: ubuntu-22.04

  build-cross-aarch64:
    name: build-cross-aarch64
    needs:
      - fast
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Cross Build for AARCH64 on Ubuntu16
        run: DOCKER_BUILDKIT=1 docker build -f trunk/Dockerfile.builds --target ubuntu16-cache-cross-aarch64 .
      - name: Cross Build for AARCH64 on Ubuntu20
        run: DOCKER_BUILDKIT=1 docker build -f trunk/Dockerfile.builds --target ubuntu20-cache-cross-aarch64 .
    runs-on: ubuntu-22.04

  test:
    name: utest-regression-blackbox-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # The dependency cache of the image must be built from the 3rdparty sources of this tree, or the build
      # would rebuild the libraries or test the old ones. When it fails, refresh the image.
      - name: Check the dependency cache
        run: |
          docker run --rm -v ${{ github.workspace }}:/srs -w /srs/trunk ossrs/srs:ubuntu20-cache \
            bash scripts/check_build_cache.sh
      # Tests
      - name: Build test image
        run: docker build --tag srs:test --build-arg MAKEARGS="-j$(nproc)" -f trunk/Dockerfile.test .
      # The utest and the regression-test run in the background, beside the blackbox-test, each in
      # its own container, and their results are checked after it. The regression-test waits for
      # the SRS API port, not a fixed time.
      - name: Start SRS utest and regression-test
        id: start
        run: |
          docker run -d --name srs-utest srs:test ./objs/srs_utest
          docker run -d --name srs-regression srs:test bash -c './objs/srs -c conf/regression-test.conf && \
              for i in $(seq 50); do (echo >/dev/tcp/127.0.0.1/1985) 2>/dev/null && break; sleep 0.2; done && \
              cd 3rdparty/srs-bench && (./objs/srs_test -test.v || (cat ../../objs/srs.log && exit 1))'
      # For blackbox-test
      - name: Run SRS blackbox-test
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_on: error
          command: |
            #docker run --rm -w /srs/trunk/3rdparty/srs-bench srs:test ./objs/srs_blackbox_test -test.v \
            #  -test.run 'TestFast_RtmpPublish_DvrFlv_Basic' -srs-log -srs-stdout srs-ffmpeg-stderr -srs-dvr-stderr \
            #  -srs-ffprobe-stdout
            docker run --rm -w /srs/trunk/3rdparty/srs-bench srs:test \
              ./objs/srs_blackbox_test -test.v -test.run '^TestFast' -test.parallel 64
            docker run --rm -w /srs/trunk/3rdparty/srs-bench srs:test \
              ./objs/srs_blackbox_test -test.v -test.run '^TestSlow' -test.parallel 3
      # For utest
      - name: Run SRS utest
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: |
          code=$(docker wait srs-utest); docker logs srs-utest; exit $code
      # For regression-test
      - name: Run SRS regression-test
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: |
          code=$(docker wait srs-regression); docker logs srs-regression; exit $code
    runs-on: ubuntu-22.04

  integ:
    name: integration-test
    needs:
      - fast
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # The dependency cache of the image must be built from the 3rdparty sources of this tree, or the build
      # would rebuild the libraries or test the old ones. When it fails, refresh the image.
      - name: Check the dependency cache
        run: |
          docker run --rm -v ${{ github.workspace }}:/srs -w /srs/trunk ossrs/srs:ubuntu20-cache \
            bash scripts/check_build_cache.sh
      - name: Build test image
        run: docker build --tag srs:test --build-arg MAKEARGS="-j$(nproc)" -f trunk/Dockerfile.test .
      # For srs-integ, the black-box integration suite, see cmd/integ/README.md. The image's
      # ffmpeg 5 writes HEVC in legacy FLV, so the test media, and the cases that run ffmpeg, use
      # its ffmpeg7. Each step mounts the media directory, so the media is made once, and kept in
      # the cache for the next runs; prepare makes again only the files whose recipe, source or
      # ffmpeg changed.
      - name: Restore the test media
        id: media
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cmd/integ/testdata/media
          key: integ-media-${{ hashFiles('doc/source.flv', 'cmd/integ/internal/media/*.go') }}
          restore-keys: integ-media-
      - name: Make the test media
        run: |
          docker run --rm -w /srs --env FFMPEG=/usr/local/bin/ffmpeg7 \
            -v ${{ github.workspace }}/cmd/integ/testdata/media:/srs/cmd/integ/testdata/media srs:test \
            make integ-prepare
      - name: Save the test media
        if: steps.media.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cmd/integ/testdata/media
          key: ${{ steps.media.outputs.cache-primary-key }}
      # Its unit tests test its clients and analyzers, and its media tests read the test media.
      # Some send media over UDP to a local fake server, which a busy runner can drop, so they
      # are retried like the cases.
      - name: Run SRS integration unit test
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_on: error
          command: |
            docker run --rm -w /srs --env FFMPEG=/usr/local/bin/ffmpeg7 \
              -v ${{ github.workspace }}/cmd/integ/testdata/media:/srs/cmd/integ/testdata/media srs:test \
              make integ-unit
      # CI runners are slower than a developer's machine, so the class limits of the cases are 4
      # times longer. The cases and the timer cases run one after the other, not at once as make
      # integ does: a runner has few cores, and the timer cases check SRS's timers, which the
      # other cases would slow. Each is retried alone, so a timer flake doesn't run the rest again.
      - name: Run SRS integration test
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_on: error
          command: |
            docker run --rm -w /srs --env FFMPEG=/usr/local/bin/ffmpeg7 \
              -v ${{ github.workspace }}/cmd/integ/testdata/media:/srs/cmd/integ/testdata/media srs:test \
              make integ-main INTEG_ARGS=-integ.limit-scale=4
      - name: Run SRS integration timer test
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_on: error
          command: |
            docker run --rm -w /srs --env FFMPEG=/usr/local/bin/ffmpeg7 \
              -v ${{ github.workspace }}/cmd/integ/testdata/media:/srs/cmd/integ/testdata/media srs:test \
              make integ-timer INTEG_ARGS=-integ.limit-scale=4
    runs-on: ubuntu-22.04

  # Chrome publishes and plays over WebRTC and HTTP against SRS for Linux in Docker: the WebRTC, loss,
  # HTTP and codec cases of the Full tier's lane I, see chrome-linux-test.sh. The unit tests of the
  # Chrome driver and of the shared helper run first. CHROME_PATH names the runner's Chrome, so a
  # runner without it fails instead of skipping the cases.
  chrome:
    name: chrome-test
    needs:
      - fast
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # The driver's puppeteer-core needs Node 22.12 or later.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: skills/internal-chrome-control/package-lock.json
      # The cases publish doc/source.flv over RTMP with the runner's FFmpeg.
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install the Chrome driver
        working-directory: skills/internal-chrome-control
        run: npm ci --ignore-scripts
      - name: Run the Chrome driver unit test
        working-directory: skills/internal-chrome-control
        run: npm test
      - name: Run the Chrome helper self-test
        run: bash skills/srs-develop/scripts/chrome-test-lib-test.sh
      - name: Build SRS for Linux in Docker
        run: bash skills/srs-develop/scripts/chrome-linux-test.sh --build
      - name: Run the Chrome cases
        run: bash skills/srs-develop/scripts/chrome-linux-test.sh
      # The build log, each case's SRS and FFmpeg logs, and the getStats() samples of every run.
      - name: Upload the Chrome logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome-test-logs
          path: /tmp/srs-chrome-linux
          if-no-files-found: ignore
    runs-on: ubuntu-22.04
    timeout-minutes: 45

  # The native Windows x64 build with MSVC, and its utest, through srs-windows-runner.sh as on the
  # Windows test host. The image has Visual Studio 2026 (18), the newest one that host has too, with
  # its vcpkg, and MSYS2, which builds FFmpeg-fit.
  windows:
    name: windows-utest
    needs:
      - fast
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # The MSVC environment, the vcpkg and FFmpeg-fit caches, and the tools the runner needs, shared
      # with the windows job of the release workflow.
      - name: Setup the Windows build
        uses: ./.github/actions/windows-build-setup
      - name: Build and run SRS utest
        shell: bash
        timeout-minutes: 60
        run: bash skills/srs-develop/scripts/srs-windows-runner.sh utest
    runs-on: windows-2025
    timeout-minutes: 90

  coverage:
    name: coverage
    needs:
      - fast
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # The dependency cache of the image must be built from the 3rdparty sources of this tree, or the build
      # would rebuild the libraries or test the old ones. When it fails, refresh the image.
      - name: Check the dependency cache
        run: |
          docker run --rm -v ${{ github.workspace }}:/srs -w /srs/trunk ossrs/srs:ubuntu20-cache \
            bash scripts/check_build_cache.sh
      # Tests
      - name: Build coverage image
        run: docker build --tag srs:cov --build-arg MAKEARGS="-j$(nproc)" -f trunk/Dockerfile.cov .
      # For coverage
      - name: Run SRS covergae
        if: ${{ startsWith(github.ref, 'refs/heads/') || startsWith(github.ref, 'refs/pull/') }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          # The hash of commit.
          SRS_SHA=${{ github.sha }}
          # Note that the root of SRS, must contains .git, for report fixing.
          SRS_PROJECT=/srs
          # The github.ref is, for example, refs/heads/develop
          SRS_BRANCH=$(echo ${{ github.ref }}| awk -F 'refs/heads/' '{print $2}'| awk -F '/' '{print $1}')
          # The github.ref is, for example, refs/pull/2536/merge
          SRS_PR=$(echo ${{ github.ref }}| awk -F 'refs/pull/' '{print $2}'| awk -F '/' '{print $1}')
          #
          echo "For github.ref=${{ github.ref }}, github.sha=${{ github.sha }}"
          echo "SRS_BRANCH=$SRS_BRANCH, SRS_PR=$SRS_PR, SRS_SHA=$SRS_SHA, SRS_PROJECT=$SRS_PROJECT"
          docker run --rm --env CODECOV_TOKEN=$CODECOV_TOKEN --env SRS_BRANCH=$SRS_BRANCH \
            --env SRS_PR=$SRS_PR --env SRS_SHA=$SRS_SHA --env SRS_PROJECT=$SRS_PROJECT \
            srs:cov bash -c './objs/srs_utest && bash auto/codecov.sh'
          #
    runs-on: ubuntu-22.04

  multiple-arch-armv7:
    name: multiple-arch-armv7
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # See https://github.com/crazy-max/ghaction-docker-buildx#moved-to-docker-organization
      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build multiple archs image
        run: |
          docker buildx build --platform linux/arm/v7 \
            --output "type=image,push=false" \
            --build-arg IMAGE=ossrs/srs:ubuntu20-cache \
            --build-arg INSTALLDEPENDS="NO" \
            --build-arg CONFARGS="--sanitizer=on" \
            -f Dockerfile .
    runs-on: ubuntu-22.04

  multiple-arch-aarch64:
    name: multiple-arch-aarch64
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # See https://github.com/crazy-max/ghaction-docker-buildx#moved-to-docker-organization
      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build multiple archs image
        run: |
          docker buildx build --platform linux/arm64/v8 \
            --output "type=image,push=false" \
            --build-arg IMAGE=ossrs/srs:ubuntu20-cache \
            --build-arg INSTALLDEPENDS="NO" \
            --build-arg CONFARGS="--sanitizer=on" \
            -f Dockerfile .
    runs-on: ubuntu-22.04

  multiple-arch-amd64:
    name: multiple-arch-amd64
    needs:
      - fast
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # See https://github.com/crazy-max/ghaction-docker-buildx#moved-to-docker-organization
      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build multiple archs image
        run: |
          docker buildx build --platform linux/amd64 \
            --output "type=image,push=false" \
            --build-arg IMAGE=ossrs/srs:ubuntu20-cache \
            --build-arg CONFARGS="--sanitizer=on" \
            -f Dockerfile .
    runs-on: ubuntu-22.04

  test-done:
    needs:
      - fast
      - coverage
      - test
      - integ
      - chrome
      - windows
      - build-centos7
      - build-ubuntu16
      - build-ubuntu18
      - build-ubuntu20
      - build-cross-arm
      - build-cross-aarch64
      - multiple-arch-armv7
      - multiple-arch-aarch64
      - multiple-arch-amd64
    runs-on: ubuntu-22.04
    steps:
      - run: echo 'All done'
