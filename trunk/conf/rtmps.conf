listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;
# RTMPS uses a dedicated port. Changing enabled or listen requires restarting SRS.
rtmps {
    enabled         on;
    listen          1443;
    key             ./conf/server.key;
    cert            ./conf/server.crt;
}
vhost __defaultVhost__ {
}
