# Bearer authentication sample for an SRS origin and the Go proxy.
#
# Start the proxy from the repository root. The proxy token protects origin
# heartbeat registration:
#
#   PROXY_HTTP_API_AUTH_ENABLED=on \
#   PROXY_HTTP_API_AUTH_TYPE=bearer \
#   PROXY_HTTP_API_AUTH_TOKEN=proxy-registration-token \
#   ./bin/srs-proxy
#
# Start this SRS origin from the trunk directory. Its heartbeat auth block below
# contains the credential used to register with the proxy:
#
#   ./objs/srs -c conf/origin1-for-proxy.bearer.auth.conf
#
# The SRS HTTP API uses the different token configured in http_api.auth below:
#
#   curl -H 'Authorization: Bearer srs-api-token' \
#     http://127.0.0.1:19851/api/v1/versions

max_connections     1000;
pid                 objs/origin1.pid;
daemon              off;
srs_log_tank        console;

rtmp {
    listen              19351;
}
http_server {
    enabled         on;
    listen          8081;
    dir             ./objs/nginx/html;
}
http_api {
    enabled         on;
    listen          19851;
    auth {
        enabled         on;
        type            bearer;
        token           srs-api-token;
    }
}
rtc_server {
    enabled on;
    listen 8001;
    candidate $CANDIDATE;
}
srt_server {
    enabled on;
    listen 10081;
    tsbpdmode off;
    tlpktdrop off;
}
heartbeat {
    enabled on;
    interval 9;
    url http://127.0.0.1:12025/api/v1/srs/register;
    device_id origin1;
    ports on;
    auth {
        enabled on;
        type bearer;
        token proxy-registration-token;
    }
}
vhost __defaultVhost__ {
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    10;
        hls_window      60;
    }
    rtc {
        enabled     on;
        rtmp_to_rtc on;
        rtc_to_rtmp on;
    }
    srt {
        enabled on;
        srt_to_rtmp on;
    }
}
