# HTTP API Basic authentication example.
#
# Start SRS from the trunk directory:
#
#   ./objs/srs -c conf/http.api.auth.basic.conf
#
# Access the API with the configured username and password:
#
#   curl --user admin:admin http://127.0.0.1:1985/api/v1/versions

max_connections     1000;
daemon              off;
srs_log_tank        console;

# RTMP server configuration
rtmp {
    listen              1935;
}
http_api {
    enabled         on;
    listen          1985;
    auth {
        enabled         on;
        # Basic authentication uses a username and password and only protects /api/ requests.
        type            basic;
        username        admin;
        password        admin;
    }
}
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}
vhost __defaultVhost__ {
}
