# Hikvision HCNetSDK on-demand pull + PTZ control.
# Build with: ./configure --hikvision=on --sctp=on && make
# Stream name:
#   Live:     SerialNO_CHANNEL_SUBCHANNEL
#             CHANNEL=1-based, SUBCHANNEL=0 main / 1 sub / ...
#   Playback: SerialNO_CHANNEL_UNIXTS
#             last field is unix timestamp (>=1e9); plays recording from that time.
#             Early frames before the requested time (file head) are skipped until
#             the first I-frame at/after the timestamp.
# Talk (WebRTC DataChannel + VoiceCom MR):
#   {"stream":"SN_1_0","cmd":"talk","action":"start"}
#   binary DC frames = G.711 uplink; server pushes G.711 downlink.
# Example play:
#   rtmp://127.0.0.1/live/DS-2CD2T47G2-Lxxxxxxxx_1_0
#   http://127.0.0.1:8080/live/DS-2CD2T47G2-Lxxxxxxxx_1_0.flv
#   http://127.0.0.1:8080/live/G75965391_2_1783880413.flv
#   Test page: http://SERVER:8080/players/hikvision.html
#
# PTZ control (HTTP or WebRTC DataChannel, same JSON):
#   POST http://127.0.0.1:1985/api/v1/hikvision/control
#   {"stream":"DS-xxx_1_0","cmd":"ptz","dir":"up","speed":4}
#   {"stream":"DS-xxx_1_0","cmd":"ptz","dir":"stop"}
#   {"stream":"DS-xxx_1_0","cmd":"preset","preset":1}
#   {"stream":"DS-xxx_1_0","cmd":"save_preset","preset":1}
# dir: up/down/left/right/zoomin/zoomout/stop
# Without stop within ptz_timeout seconds, motion auto-stops.

listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    # getUserMedia needs secure context: use https://host:8088/players/hikvision.html
    https {
        enabled     on;
        listen      8088;
        key         ./conf/server.key;
        cert        ./conf/server.crt;
    }
}

http_api {
    enabled         on;
    listen          1985;
    https {
        enabled     on;
        listen      1990;
        key         ./conf/server.key;
        cert        ./conf/server.crt;
    }
}

# Hikvision device registry. Supports multiple device blocks.
hikvision {
    enabled         on;
    # Directory that contains libhcnetsdk.so and HCNetSDKCom/
    # Prefer absolute path under systemd (relative paths use process cwd/work_dir).
    # Example relative (only safe if work_dir or WorkingDirectory is trunk):
    #   sdk_path ./libs/lib-amd64;
    # aarch64: ./libs/lib-aarch64 or absolute .../libs/lib-aarch64
    sdk_path        ./libs/lib-amd64;
    # Publish template; [stream] is replaced by SerialNO_CHANNEL_SUBCHANNEL
    output          rtmp://127.0.0.1/live/[stream];
    # Seconds with zero players before StopRealPlay
    idle_timeout    30;
    # Seconds without stop/refresh before auto-stop PTZ motion
    ptz_timeout     30;

    device {
        serialno    DS-2CD2T47G2-L20250101AACH12345678;
        host        192.168.1.64;
        port        8000;
        user        admin;
        password    ********;
    }

    # device {
    #     serialno    DS-7608N-I2-20240101AACH87654321;
    #     host        192.168.1.100;
    #     port        8000;
    #     user        admin;
    #     password    ********;
    # }
}

vhost __defaultVhost__ {
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
    hls {
        enabled     on;
    }
}
