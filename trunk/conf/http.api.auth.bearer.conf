# HTTP API Bearer authentication example.
#
# Start SRS from the trunk directory:
#
#   ./objs/srs -c conf/http.api.auth.bearer.conf
#
# Access the API with the configured Bearer token:
#
#   curl -H 'Authorization: Bearer srs-api-token' \
#     http://127.0.0.1:1985/api/v1/versions
#
# By default, Bearer authentication does not protect WebRTC signaling APIs.
# Set rtc_bearer_enabled to on to protect WHIP and WHEP with the same token:
#
#   curl -H 'Authorization: Bearer srs-api-token' \
#     -H 'Content-Type: application/sdp' --data-binary @offer.sdp \
#     'http://127.0.0.1:1985/rtc/v1/whip/?app=live&stream=livestream'

max_connections     1000;
daemon              off;
srs_log_tank        console;

# RTMP server configuration
rtmp {
    listen              1935;
}
http_api {
    enabled         on;
    listen          1985;
    auth {
        enabled         on;
        # Bearer authentication protects /api/ requests and uses a token instead of a username or password.
        type            bearer;
        token           srs-api-token;
        # Optional Bearer authentication for /rtc/ signaling requests. Default: off.
        rtc_bearer_enabled off;
    }
}
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}
vhost __defaultVhost__ {
}
