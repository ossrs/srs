# HTTP API Bearer authentication example.
#
# Start SRS from the trunk directory:
#
#   ./objs/srs -c conf/http.api.auth.bearer.conf
#
# Access the API with the configured Bearer token:
#
#   curl -H 'Authorization: Bearer srs-api-token' \
#     http://127.0.0.1:1985/api/v1/versions

max_connections     1000;
daemon              off;
srs_log_tank        console;

# RTMP server configuration
rtmp {
    listen              1935;
}
http_api {
    enabled         on;
    listen          1985;
    auth {
        enabled         on;
        # Bearer authentication uses a token and does not use a username or password.
        type            bearer;
        token           srs-api-token;
    }
}
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}
vhost __defaultVhost__ {
}
